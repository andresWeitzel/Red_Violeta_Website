<section class="hero" aria-label="Mensajes principales">
  <div
    id="inicioCarousel"
    class="carousel slide hero-carousel"
    data-ride="carousel"
    data-interval="7000"
    data-pause="hover"
  >
    <ol class="carousel-indicators">
      @for (slide of slides; track slide.id; let i = $index) {
        <li
          data-target="#inicioCarousel"
          [attr.data-slide-to]="i"
          [class.active]="$first"
          [attr.aria-label]="'Ir al mensaje ' + (i + 1)"
        ></li>
      }
    </ol>

    <div class="carousel-inner">
      @for (slide of slides; track slide.id) {
        <div class="carousel-item" [class.active]="$first">
          <div class="hero-frame hero-frame--photo">
            <img [src]="slide.src" [alt]="slide.alt" />
            <div class="hero-scrim" aria-hidden="true"></div>
            <div class="hero-copy hero-copy--overlay">
              <p class="hero-kicker">{{ slide.kicker }}</p>
              @if (slide.titleLines) {
                <h1 class="hero-title-poster">
                  @for (line of slide.titleLines; track line) {
                    <span>{{ line }}</span>
                  }
                </h1>
              } @else {
                <h2>{{ slide.title }}</h2>
              }
              <p class="hero-text">{{ slide.text }}</p>
              <a class="hero-cta" href="#lineas-de-ayuda">Ver líneas de ayuda</a>
            </div>
          </div>
        </div>
      }
    </div>

    <a
      class="carousel-control-prev"
      href="#inicioCarousel"
      role="button"
      data-slide="prev"
      aria-label="Mensaje anterior"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    </a>
    <a
      class="carousel-control-next"
      href="#inicioCarousel"
      role="button"
      data-slide="next"
      aria-label="Mensaje siguiente"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
    </a>
  </div>
</section>
